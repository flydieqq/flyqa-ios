name: Build flyqa iOS (.ipa)

on:
  push:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and sync Capacitor iOS
        working-directory: flyqa-ios
        run: |
          npm install
          npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: flyqa-ios/ios/App
        run: |
          pod install

      - name: Build unsigned iOS archive with xcodebuild
        working-directory: flyqa-ios/ios/App
        run: |
          mkdir -p build
          if [ -d "App.xcworkspace" ]; then
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/flyqa.xcarchive" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/flyqa.xcarchive" \
              archive \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Package unsigned .ipa
        working-directory: flyqa-ios/ios/App
        run: |
          mkdir -p build/ipa/Payload
          cp -R "build/flyqa.xcarchive/Products/Applications/"*.app build/ipa/Payload/
          cd build/ipa
          zip -r -y "$GITHUB_WORKSPACE/flyqa-ios-unsigned.ipa" Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: flyqa-ios-ipa
          path: flyqa-ios-unsigned.ipa
          retention-days: 30
